name: Auto-Train SRM Model

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    paths:
      - 'train_ci.py' # Auto-trigger when this script is updated

permissions:
  contents: write

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision opencv-python-headless numpy rasterio

      - name: Train Satellite Super-Resolution Model
        run: python train_ci.py

      - name: Commit and Push New Weights
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add models/edsr_satellite.pth
          # Only commit if weights actually changed/were generated
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update satellite-trained EDSR weights"
          git push
